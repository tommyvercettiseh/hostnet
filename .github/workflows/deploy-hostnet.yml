name: Central Hostnet Deploy

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project to deploy"
        required: true
        type: choice
        options:
          - pallet-optimizer
          - rebirth
          - website
  push:
    branches:
      - main
    paths:
      - ".deploy-trigger"
      - "deploy-config.json"
      - ".github/workflows/deploy-hostnet.yml"

  pull_request:

permissions:
  contents: read
concurrency:
  group: hostnet-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: |
          python3 -m json.tool deploy-config.json > /dev/null
          jq -e '.website.source | contains("project/projects") and contains("project/diensten") and contains("project/.htaccess")' deploy-config.json > /dev/null
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout central deploy repo
        uses: actions/checkout@v4

      - name: Resolve project
        id: project
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project }}"
          else
            PROJECT="$(sed -n 's/^project=//p' .deploy-trigger | head -n 1)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "No project selected."
            exit 1
          fi

          if ! jq -e --arg project "$PROJECT" '.[$project]' deploy-config.json >/dev/null; then
            echo "Unknown project: $PROJECT"
            exit 1
          fi

          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r --arg project "$PROJECT" '.[$project].repository' deploy-config.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r --arg project "$PROJECT" '.[$project].ref' deploy-config.json)" >> "$GITHUB_OUTPUT"
          echo "source=$(jq -r --arg project "$PROJECT" '.[$project].source' deploy-config.json)" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -r --arg project "$PROJECT" '.[$project].target' deploy-config.json)" >> "$GITHUB_OUTPUT"
          echo "strip=$(jq -r --arg project "$PROJECT" '.[$project].strip_components' deploy-config.json)" >> "$GITHUB_OUTPUT"
          echo "public_url=$(jq -r --arg project "$PROJECT" '.[$project].public_url' deploy-config.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout selected project
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.project.outputs.repository }}
          ref: ${{ steps.project.outputs.ref }}
          path: project

      - name: Verify deploy source
        shell: bash
        run: |
          IFS=',' read -ra SOURCES <<< "${{ steps.project.outputs.source }}"
          for source in "${SOURCES[@]}"; do
            if [ ! -e "$source" ]; then
              echo "Missing deploy source: $source"
              exit 1
            fi
          done

      - name: Create target directory
        if: steps.project.outputs.name != 'website'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ssh.cyz0ptrz6.service.one
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p "${{ steps.project.outputs.target }}"

      - name: Upload selected project
        if: steps.project.outputs.name != 'website'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ssh.cyz0ptrz6.service.one
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "${{ steps.project.outputs.source }}"
          target: "${{ steps.project.outputs.target }}"
          strip_components: ${{ steps.project.outputs.strip }}
          overwrite: true

      - name: Validate complete website
        if: steps.project.outputs.name == 'website'
        working-directory: project
        run: python3 scripts/deploy_hostnet.py --check

      - name: Install website SFTP client
        if: steps.project.outputs.name == 'website'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-paramiko

      - name: Back up, publish and verify complete website
        if: steps.project.outputs.name == 'website'
        working-directory: project
        run: /usr/bin/python3 scripts/deploy_hostnet.py
        env:
          HOSTNET_HOST: ssh.cyz0ptrz6.service.one
          HOSTNET_USER: ${{ secrets.FTP_USERNAME }}
          HOSTNET_WEBROOT: /webroots/sites/httpdocs
          HOSTNET_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Hostnet deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: ${{ steps.project.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.project.outputs.public_url }}" >> "$GITHUB_STEP_SUMMARY"
